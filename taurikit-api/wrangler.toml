#:schema node_modules/wrangler/config-schema.json

name = "taurikit-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[[d1_databases]]
binding = "DB"
database_name = "taurikit-db"
database_id = "f750bd92-b86e-49c8-acc9-1beea2249821"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TEMPLATES"
bucket_name = "taurikit-templates"

[vars]
STRIPE_PRICE_ID = ""

# Set these via `wrangler secret put`:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# RESEND_API_KEY
