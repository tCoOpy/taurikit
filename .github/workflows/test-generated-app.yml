name: Test Generated App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.0.5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: taurikit-x86_64-unknown-linux-gnu.tar.gz
            binary: taurikit
          - os: macos-latest
            asset: taurikit-aarch64-apple-darwin.tar.gz
            binary: taurikit
          - os: windows-latest
            asset: taurikit-x86_64-pc-windows-msvc.zip
            binary: taurikit.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download CLI from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z x "${{ matrix.asset }}"
          else
            tar xzf "${{ matrix.asset }}"
          fi
          chmod +x "${{ matrix.binary }}" 2>/dev/null || true

      - name: Generate test app (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            script -q /dev/null ./"${{ matrix.binary }}" new "TestApp" \
              --auth none --ui shadcn --template ./scaffold \
              --yes --no-git --no-install --output ./test-output
          else
            script -qec './"${{ matrix.binary }}" new "TestApp" \
              --auth none --ui shadcn --template ./scaffold \
              --yes --no-git --no-install --output ./test-output' /dev/null
          fi

      - name: Generate test app (Windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.binary }} new "TestApp" `
            --auth none --ui shadcn --template ./scaffold `
            --yes --no-git --no-install --output ./test-output

      - name: Install frontend dependencies
        working-directory: test-output
        run: bun install

      - name: TypeScript check
        working-directory: test-output
        run: bunx tsc --noEmit

      - name: Frontend tests
        working-directory: test-output
        run: bun run test

      - name: Vite build
        working-directory: test-output
        run: bun run build

      - name: Rust build
        working-directory: test-output/src-tauri
        run: cargo build

      - name: Rust tests
        working-directory: test-output/src-tauri
        run: cargo test

      - name: Launch app (Linux)
        if: runner.os == 'Linux'
        working-directory: test-output
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum timeout 15 ./src-tauri/target/debug/testapp 2>&1 || code=$?
          # Exit code 124 = timeout killed it (app was still running = success)
          if [ "${code:-0}" -eq 124 ] || [ "${code:-0}" -eq 0 ]; then
            echo "✓ App launched successfully"
          else
            echo "✗ App crashed with exit code $code"
            exit 1
          fi

      - name: Launch app (macOS)
        if: runner.os == 'macOS'
        working-directory: test-output
        run: |
          ./src-tauri/target/debug/testapp &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "✓ App launched successfully"
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID" || code=$?
            echo "✗ App crashed with exit code ${code:-0}"
            exit 1
          fi

      - name: Launch app (Windows)
        if: runner.os == 'Windows'
        working-directory: test-output
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\src-tauri\target\debug\testapp.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) {
              Write-Error "App crashed with exit code $($proc.ExitCode)"
              exit 1
            }
          } else {
            $proc | Stop-Process -Force
          }
          Write-Host "✓ App launched successfully"
