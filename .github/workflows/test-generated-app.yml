name: Test Generated App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.0.5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: taurikit-x86_64-unknown-linux-gnu.tar.gz
            binary: taurikit
          - os: macos-15
            asset: taurikit-aarch64-apple-darwin.tar.gz
            binary: taurikit
          - os: windows-latest
            asset: taurikit-x86_64-pc-windows-msvc.zip
            binary: taurikit.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download CLI from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z x "${{ matrix.asset }}"
          else
            tar xzf "${{ matrix.asset }}"
          fi
          chmod +x "${{ matrix.binary }}" 2>/dev/null || true

      - name: Generate test app
        shell: bash
        run: |
          ./"${{ matrix.binary }}" new "TestApp" \
            --auth none \
            --ui shadcn \
            --template ./scaffold \
            --yes \
            --no-git \
            --no-install \
            --output ./test-output

      - name: Install frontend dependencies
        working-directory: test-output
        run: bun install

      - name: TypeScript check
        working-directory: test-output
        run: bunx tsc --noEmit

      - name: Rust check
        working-directory: test-output/src-tauri
        run: cargo check

      - name: Vite build
        working-directory: test-output
        run: bun run build
