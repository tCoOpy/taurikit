name: Package Template

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package scaffold
        run: |
          tar czf "taurikit-${{ steps.version.outputs.version }}.tar.gz" \
            -C scaffold \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='.claude' \
            --exclude='MEMORY.md' \
            base auth ui manifest.toml

      - name: Upload to API
        run: |
          curl -fsSL \
            -X POST \
            -H "X-Admin-Key: ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@taurikit-${{ steps.version.outputs.version }}.tar.gz" \
            "${{ secrets.API_URL }}/template/upload?version=${{ steps.version.outputs.version }}"
