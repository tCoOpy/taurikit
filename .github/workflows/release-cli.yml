name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

      - name: Update version files
        run: |
          v="${{ steps.v.outputs.version }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$v\"/" scaffold/manifest.toml
          sed -i "s/^crabyard_version = \"[^\"]*\"/crabyard_version = \"$v\"/" scaffold/manifest.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$v\"/" scaffold/base/manifest.toml
          sed -i "s/^crabyard_version = \"[^\"]*\"/crabyard_version = \"$v\"/" scaffold/base/manifest.toml
          sed -i "0,/^version = \"[^\"]*\"/{s/^version = \"[^\"]*\"/version = \"$v\"/}" crabyard-cli/Cargo.toml
          sed -i "s/CRABYARD_VERSION}} | [0-9.]*/CRABYARD_VERSION}} | $v/g" .cursorrules 2>/dev/null || true
          sed -i "s/CRABYARD_VERSION}} | [0-9.]*/CRABYARD_VERSION}} | $v/g" .github/copilot-instructions.md 2>/dev/null || true
          sed -i "s/CRABYARD_VERSION}} | [0-9.]*/CRABYARD_VERSION}} | $v/g" crabyard-docs/src/content/docs/guides/overlay-architecture.md 2>/dev/null || true

      - name: Package and upload scaffold
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          API_URL: ${{ vars.API_URL || 'https://taurikit-api-production.up.railway.app' }}
        run: |
          v="${{ steps.v.outputs.version }}"
          cd scaffold
          tar -czf /tmp/crabyard-${v}.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='.claude' \
            --exclude='MEMORY.md' \
            base auth ui manifest.toml
          cd ..
          curl -fsS -X POST \
            "${API_URL}/template/upload?version=${v}" \
            -H "X-Admin-Key: ${ADMIN_KEY}" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/crabyard-${v}.tar.gz

      - name: Commit, tag, and push
        run: |
          v="${{ steps.v.outputs.version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "release v${v}"
          git tag "v${v}"
          git push origin main
          git push origin "v${v}"

  build:
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: crabyard
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: crabyard
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: crabyard
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: crabyard
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: crabyard.exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: crabyard-cli

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crabyard-cli -> target"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker || '' }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../../crabyard-${{ matrix.target }}.zip ${{ matrix.binary }}
          else
            tar czf ../../../crabyard-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crabyard-${{ matrix.target }}
          path: crabyard-cli/crabyard-${{ matrix.target }}.*

  release:
    needs: [prepare, build]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
