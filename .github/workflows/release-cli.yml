name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: taurikit
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            binary: taurikit
            linker: aarch64-linux-gnu-gcc
          - os: macos-15
            target: x86_64-apple-darwin
            binary: taurikit
          - os: macos-16
            target: aarch64-apple-darwin
            binary: taurikit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: taurikit.exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: taurikit-cli

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "taurikit-cli -> target"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker || '' }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../../taurikit-${{ matrix.target }}.zip ${{ matrix.binary }}
          else
            tar czf ../../../taurikit-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taurikit-${{ matrix.target }}
          path: taurikit-cli/taurikit-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
