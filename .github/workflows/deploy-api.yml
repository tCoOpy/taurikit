name: Typecheck API

on:
  push:
    branches: [main]
    paths: ['taurikit-api/**']
  pull_request:
    paths: ['taurikit-api/**']

defaults:
  run:
    working-directory: taurikit-api

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

# Railway auto-deploys on push to main via GitHub integration.
# No deploy step needed here.
